name: Release

# Builds every final release asset on GitHub-hosted runners. A pushed vX.Y.Z
# tag creates a draft GitHub release for review; pull requests that touch
# packaging and manual runs build the assets without publishing. Release
# candidates are built locally with scripts/rc.py and get no tag here.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "!v*-rc.*"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/collect_licenses.py
      - scripts/package-release.sh
      - scripts/package-dmg.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Collect dependency licenses for all release targets
        run: python3 scripts/collect_licenses.py dist-licenses
      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: dist-licenses/

  macos:
    needs: licenses
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: dist-licenses
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build
        run: cargo build --release --locked
      - name: Smoke test
        run: |
          target/release/mlxtop --version
          target/release/mlxtop --once --interval 1 | head -5
      - name: Package archive and DMG installer
        run: |
          archive="$(scripts/package-release.sh aarch64-apple-darwin target/release/mlxtop dist dist-licenses)"
          scripts/package-dmg.sh "${archive%.tar.gz}" dist/dmg
          mv dist/dmg/*.dmg dist/
      - uses: actions/upload-artifact@v4
        with:
          name: assets-aarch64-apple-darwin
          path: |
            dist/*.tar.gz
            dist/*.dmg

  linux:
    needs: licenses
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: dist-licenses
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build static binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary is static and runs
        run: |
          binary=target/${{ matrix.target }}/release/mlxtop
          file "$binary"
          file "$binary" | grep -q 'statically linked\|static-pie linked'
          "$binary" --version
          "$binary" --once --interval 1 | head -5
      - name: Package archive
        run: scripts/package-release.sh ${{ matrix.target }} target/${{ matrix.target }}/release/mlxtop dist dist-licenses
      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum mlxtop-*.dmg mlxtop-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          for target in aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            test -f "dist/mlxtop-$version-$target.tar.gz"
          done
          test -f "dist/mlxtop-$version-aarch64-apple-darwin.dmg"
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The changelog section for this version seeds the notes for review.
          awk -v heading="## $version " 'index($0, heading) == 1 {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          flags=(--draft --verify-tag --title "mlxtop $GITHUB_REF_NAME" --notes-file notes.md)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/mlxtop-* dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: release-assets
          path: dist/
